name: Feature request
description: Suggest a new method, detector, option or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        StegoForge is offline-first and self-contained: it works without network services or special hardware, and keeps its dependencies small enough to review.
        Ideas that fit that scope are the easiest to accept. Please read [CONTRIBUTING.md](https://github.com/Nour833/StegoForge/blob/main/CONTRIBUTING.md) first.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do, not only the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: The command, option or behaviour you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What did you try instead?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: It works offline and does not need a service or special hardware.
        - label: I would be willing to help build or test it.
